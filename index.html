<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>חמ"ל אוכלוסייה - קדם | צוות ה-11</title>
    <style>
        :root { --bg: #050505; --panel: #111; --accent: #ff0000; --text: #eee; --kdm: #fbc02d; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: #000; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--kdm); }
        .logo { font-weight: 900; color: var(--kdm); font-size: 1.6rem; }
        #clock { font-family: monospace; font-size: 1.6rem; color: #fff; background: #222; padding: 5px 15px; border-radius: 4px; border: 1px solid #444; }
        .dashboard { display: grid; grid-template-columns: 350px 1fr 350px; flex: 1; gap: 8px; padding: 8px; overflow: hidden; }
        .col { display: flex; flex-direction: column; gap: 8px; }
        .video-matrix { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; }
        .card { background: var(--panel); border: 1px solid #333; border-radius: 4px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        .card-label { background: rgba(0,0,0,0.9); color: var(--kdm); font-size: 11px; padding: 3px 8px; font-weight: bold; border-bottom: 1px solid #444; }
        iframe { width: 100%; height: 100%; border: none; background: #000; }
        /* עיצוב כפתורי עזר אם הווידאו נחסם */
        .overlay-link { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.7); z-index: 5; flex-direction: column; gap: 10px; text-align: center; padding: 20px; }
        .btn-fix { background: var(--kdm); color: black; border: none; padding: 8px 15px; font-weight: bold; cursor: pointer; border-radius: 4px; text-decoration: none; }
    </style>
</head>
<body>

<header>
    <div class="logo">חמ"ל אוכלוסייה - קדם // HQ</div>
    <div id="clock">00:00:00</div>
</header>

<div class="dashboard">
    <div class="col">
        <div class="card" style="flex: 2;">
            <div class="card-label">פיקוד העורף - LIVE (מפה רשמית)</div>
            <iframe src="https://www.oref.org.il/12481-he/Pakar.aspx" allowfullscreen></iframe>
        </div>
        <div class="card" style="flex: 1;">
            <div class="card-label">יומן אירועים מבצעי</div>
            <div style="padding:10px; height:100%; display:flex; flex-direction:column;">
                <div id="log-list" style="flex:1; overflow-y:auto; font-size:12px; border:1px solid #222; margin-bottom:5px; background:#000;"></div>
                <input type="text" id="log-input" placeholder="דיווח חדש..." style="width:90%; background:#222; color:white; border:1px solid #444; padding:5px;">
            </div>
        </div>
    </div>

    <div class="col video-matrix">
        <div class="card">
            <div class="card-label">כאן 11 - שידור חי</div>
            <iframe src="https://www.youtube.com/embed/videoseries?list=PLvV7oP6E6vE_V_6SAn12I0fBqYmH87E1l&autoplay=1&mute=1"></iframe>
        </div>
        <div class="card">
            <div class="card-label">חדשות 12 - (שידור יוטיוב זמין)</div>
            <iframe src="https://www.youtube.com/embed/live_stream?channel=UCuO6H_r_pL6L-S769P0r18g&autoplay=1&mute=1"></iframe>
        </div>
        <div class="card">
            <div class="card-label">ערוץ 14 - שידור חי</div>
            <iframe src="https://www.youtube.com/embed/videoseries?list=PLvV7oP6E6vE-r0jD2Mre9_fS_p9rU8y6l&autoplay=1&mute=1"></iframe>
        </div>
        <div class="card">
            <div class="card-label">חדשות 13 - (שידור יוטיוב זמין)</div>
            <iframe src="https://www.youtube.com/embed/videoseries?list=PLvV7oP6E6vE-v0M9N_K2m5H5N1zGzS6J0&autoplay=1&mute=1"></iframe>
        </div>
    </div>

    <div class="col">
        <div class="card" style="flex: 1.2;">
            <div class="card-label">מצלמת חוף - ת"א (ישיר)</div>
            <iframe src="https://beachcam.co.il/gordon.html"></iframe>
        </div>
        <div class="card" style="flex: 1;">
            <div class="card-label">מפת תנועה ורוחות (Windy)</div>
            <iframe src="https://www.windy.com/?32.085,34.782,10&menu=0&share=0"></iframe>
        </div>
    </div>
</div>

<script>
    function updateClock() { document.getElementById('clock').innerText = new Date().toLocaleTimeString('he-IL', { hour12: false }); }
    setInterval(updateClock, 1000); updateClock();

    // לוגיקת יומן פשוטה
    const input = document.getElementById('log-input');
    const list = document.getElementById('log-list');
    input.addEventListener('keypress', (e) => {
        if(e.key === 'Enter' && input.value) {
            const div = document.createElement('div');
            div.innerHTML = `<span style="color:#fbc02d">[${new Date().toLocaleTimeString()}]</span> ${input.value}`;
            list.appendChild(div);
            input.value = '';
        }
    });
</script>
</body>
</html>
