<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>חמ"ל אוכלוסייה - קדם | HQ 3.1</title>
    <style>
        :root { --bg: #050505; --panel: #111; --accent: #fbc02d; --text: #eee; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Tactical Header */
        header { background: #000; padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--accent); }
        .logo { font-weight: 900; color: var(--accent); font-size: 1.8rem; letter-spacing: 1px; }
        #clock { font-family: monospace; font-size: 1.8rem; color: #fff; background: #222; padding: 5px 15px; border-radius: 4px; border: 1px solid #333; }

        /* Dashboard Grid */
        .dashboard { display: grid; grid-template-columns: 350px 1fr 350px; flex: 1; gap: 8px; padding: 8px; overflow: hidden; }
        .col { display: flex; flex-direction: column; gap: 8px; }
        .video-matrix { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; }
        
        /* Cards */
        .card { background: var(--panel); border: 1px solid #333; border-radius: 4px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        .card-label { background: rgba(0,0,0,0.9); color: var(--accent); font-size: 11px; padding: 5px 10px; font-weight: bold; border-bottom: 1px solid #444; }
        
        iframe { width: 100%; height: 100%; border: none; background: #000; }

        /* Tactical Log */
        .log-area { flex: 1; display: flex; flex-direction: column; padding: 10px; background: #080808; }
        #log-display { flex: 1; overflow-y: auto; font-size: 12px; color: #888; border: 1px solid #1a1a1a; padding: 5px; }
        input { background: #1a1a1a; border: 1px solid #333; color: white; padding: 8px; margin-top: 5px; border-radius: 3px; }
    </style>
</head>
<body>

<header>
    <div class="logo">חמ"ל אוכלוסייה - קדם</div>
    <div id="clock">00:00:00</div>
</header>

<div class="dashboard">
    <div class="col">
        <div class="card" style="flex: 2;">
            <div class="card-label">פיקוד העורף - LIVE (מפה עוקפת חסימה)</div>
            <iframe src="https://www.oref.org.il/12481-he/Pakar.aspx" title="Oref"></iframe>
            </div>
        <div class="card" style="flex: 1;">
            <div class="card-label">יומן מבצעי - קדם</div>
            <div class="log-area">
                <div id="log-display"></div>
                <input type="text" id="log-in" placeholder="הקלד דיווח מהיר..." onkeypress="if(event.key==='Enter') pushLog()">
            </div>
        </div>
    </div>

    <div class="col video-matrix">
        <div class="card">
            <div class="card-label">כאן 11 - שידור חי</div>
            <iframe src="https://www.youtube.com/embed/live_stream?channel=UCKEImtWik1M1X5Y3x_fX0_w&autoplay=1&mute=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <div class="card">
            <div class="card-label">חדשות 12 - N12 (לייב)</div>
            <iframe src="https://www.youtube.com/embed/live_stream?channel=UCuO6H_r_pL6L-S769P0r18g&autoplay=1&mute=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <div class="card">
            <div class="card-label">חדשות 13 - מבזקים</div>
            <iframe src="https://www.youtube.com/embed/live_stream?channel=UCvW8HlX6O_69uX-Ym6fOUnA&autoplay=1&mute=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <div class="card">
            <div class="card-label">ערוץ 14 - שידור חי</div>
            <iframe src="https://www.youtube.com/embed/live_stream?channel=UCuO6H_r_pL6L-S769P0r18g&autoplay=1&mute=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>

    <div class="col">
        <div class="card" style="flex: 1.2;">
            <div class="card-label">מצלמות נתיבי ישראל / חופים</div>
            <iframe src="https://www.ayalonhw.co.il/map/"></iframe>
        </div>
        <div class="card" style="flex: 1;">
            <div class="card-label">מכ"ם רוחות וגשם - Windy</div>
            <iframe src="https://www.windy.com/?32.085,34.782,10&menu=0"></iframe>
        </div>
        <div class="card" style="flex: 0.8;">
            <div class="card-label">מבזקי MivzakLive</div>
            <iframe src="https://www.mivzaklive.co.il/live"></iframe>
        </div>
    </div>
</div>

<script>
    function updateClock() { document.getElementById('clock').innerText = new Date().toLocaleTimeString('he-IL', { hour12: false }); }
    setInterval(updateClock, 1000); updateClock();

    function pushLog() {
        const logDisp = document.getElementById('log-display');
        const logIn = document.getElementById('log-in');
        if(!logIn.value) return;
        logDisp.innerHTML += `<div><span style="color:var(--accent)">[${new Date().toLocaleTimeString()}]</span> ${logIn.value}</div>`;
        logIn.value = '';
        logDisp.scrollTop = logDisp.scrollHeight;
    }
</script>
</body>
</html>
