<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>חמ"ל אוכלוסייה - קדם | גרסה 3.0</title>
    <style>
        :root { --bg: #050505; --panel: #111; --accent: #fbc02d; --text: #eee; --alert: #ff1744; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: #000; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--accent); }
        .logo { font-weight: 900; color: var(--accent); font-size: 1.6rem; }
        #clock { font-family: monospace; font-size: 1.7rem; color: #fff; }
        
        .dashboard { display: grid; grid-template-columns: 350px 1fr 350px; flex: 1; gap: 8px; padding: 8px; overflow: hidden; }
        .col { display: flex; flex-direction: column; gap: 8px; }
        .video-matrix { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; }
        
        .card { background: var(--panel); border: 1px solid #333; border-radius: 4px; overflow: hidden; position: relative; }
        .card-label { background: rgba(0,0,0,0.9); color: var(--accent); font-size: 11px; padding: 3px 8px; font-weight: bold; border-bottom: 1px solid #444; z-index: 10; }
        
        iframe { width: 100%; height: 100%; border: none; background: #000; }

        /* Alert Ticker */
        #alert-banner { background: var(--alert); color: white; padding: 10px; font-weight: bold; text-align: center; display: none; font-size: 1.2rem; }
    </style>
</head>
<body>

<div id="alert-banner">התראה פעילה: <span id="alert-text"></span></div>

<header>
    <div class="logo">חמ"ל אוכלוסייה - קדם</div>
    <div id="clock">00:00:00</div>
</header>

<div class="dashboard">
    <div class="col">
        <div class="card" style="flex: 2;">
            <div class="card-label">מפת פיקוד העורף - LIVE</div>
            <iframe src="https://tzevadom.com/map"></iframe>
        </div>
        <div class="card" style="flex: 1;">
            <div class="card-label">יומן מבצעי</div>
            <div id="log-display" style="padding:10px; font-size:12px; height:80%; overflow-y:auto;"></div>
            <input type="text" id="log-in" placeholder="דיווח..." style="width:90%; margin:5px; background:#222; color:white; border:1px solid #444;">
        </div>
    </div>

    <div class="col video-matrix">
        <div class="card">
            <div class="card-label">כאן 11</div>
            <iframe src="https://www.youtube.com/embed/live_stream?channel=UCKEImtWik1M1X5Y3x_fX0_w&autoplay=1&mute=1"></iframe>
        </div>
        <div class="card">
            <div class="card-label">חדשות 12 - N12</div>
            <iframe src="https://www.youtube.com/embed/live_stream?channel=UCuO6H_r_pL6L-S769P0r18g&autoplay=1&mute=1"></iframe>
        </div>
        <div class="card">
            <div class="card-label">חדשות 13</div>
            <iframe src="https://www.youtube.com/embed/live_stream?channel=UCvW8HlX6O_69uX-Ym6fOUnA&autoplay=1&mute=1"></iframe>
        </div>
        <div class="card">
            <div class="card-label">ערוץ 14</div>
            <iframe src="https://www.youtube.com/embed/live_stream?channel=UCuO6H_r_pL6L-S769P0r18g&autoplay=1&mute=1"></iframe>
        </div>
    </div>

    <div class="col">
        <div class="card" style="flex: 1;"><div class="card-label">מצלמות נתיבי ישראל</div><iframe src="https://www.ayalonhw.co.il/map/"></iframe></div>
        <div class="card" style="flex: 1;"><div class="card-label">מכ"ם Windy</div><iframe src="https://www.windy.com/?32.085,34.782,10&menu=0"></iframe></div>
    </div>
</div>

<script>
    function updateClock() { document.getElementById('clock').innerText = new Date().toLocaleTimeString('he-IL', { hour12: false }); }
    setInterval(updateClock, 1000); updateClock();

    // ניטור התראות אמת דרך ה-API שיצרנו
    async function checkAlerts() {
        try {
            const r = await fetch('/api/alerts');
            const data = await r.json();
            if (data.data && data.data.length > 0) {
                document.getElementById('alert-banner').style.display = 'block';
                document.getElementById('alert-text').innerText = data.data.join(', ');
            } else {
                document.getElementById('alert-banner').style.display = 'none';
            }
        } catch (e) {}
    }
    setInterval(checkAlerts, 5000);

    const logDisp = document.getElementById('log-display');
    const logIn = document.getElementById('log-in');
    logIn.addEventListener('keypress', (e) => {
        if(e.key === 'Enter' && logIn.value) {
            logDisp.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${logIn.value}</div>`;
            logIn.value = '';
            logDisp.scrollTop = logDisp.scrollHeight;
        }
    });
</script>
</body>
</html>
